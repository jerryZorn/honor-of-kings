<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王者荣耀 - 英雄攻略站</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #141b3d;
            --bg-card: #1a2247;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --accent-gold: #f0b90b;
            --accent-blue: #3b82f6;
            
            --tank: #e63946;
            --warrior: #ff6b35;
            --assassin: #9333ea;
            --mage: #06b6d4;
            --marksman: #22c55e;
            --support: #f59e0b;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.15;
            background: 
                radial-gradient(circle at 20% 50%, var(--accent-blue) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, var(--accent-gold) 0%, transparent 50%);
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, 5%) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 0 60px;
            position: relative;
        }

        .logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-gold), #fff, var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(240, 185, 11, 0.3);
            letter-spacing: 2px;
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-top: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Search & Filter Section */
        .controls {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .search-box {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 30px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 16px 50px 16px 24px;
            background: var(--bg-card);
            border: 2px solid transparent;
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 20px rgba(240, 185, 11, 0.2);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        .filter-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 12px 24px;
            border: 2px solid;
            background: transparent;
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .filter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .filter-btn:hover::before,
        .filter-btn.active::before {
            opacity: 0.2;
        }

        .filter-btn.all { border-color: var(--accent-gold); }
        .filter-btn.all::before { background: var(--accent-gold); }
        .filter-btn.tank { border-color: var(--tank); }
        .filter-btn.tank::before { background: var(--tank); }
        .filter-btn.warrior { border-color: var(--warrior); }
        .filter-btn.warrior::before { background: var(--warrior); }
        .filter-btn.assassin { border-color: var(--assassin); }
        .filter-btn.assassin::before { background: var(--assassin); }
        .filter-btn.mage { border-color: var(--mage); }
        .filter-btn.mage::before { background: var(--mage); }
        .filter-btn.marksman { border-color: var(--marksman); }
        .filter-btn.marksman::before { background: var(--marksman); }
        .filter-btn.support { border-color: var(--support); }
        .filter-btn.support::before { background: var(--support); }

        .filter-btn.active {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px currentColor;
        }

        /* Hero Grid */
        .hero-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }

        .hero-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
            animation: cardFadeIn 0.6s ease backwards;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .hero-card.tank::before { background: var(--tank); }
        .hero-card.warrior::before { background: var(--warrior); }
        .hero-card.assassin::before { background: var(--assassin); }
        .hero-card.mage::before { background: var(--mage); }
        .hero-card.marksman::before { background: var(--marksman); }
        .hero-card.support::before { background: var(--support); }

        .hero-card:hover {
            transform: translateY(-8px);
            border-color: currentColor;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .hero-card:hover::before {
            opacity: 1;
        }

        .hero-avatar {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-primary));
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
            overflow: hidden;
        }

        .hero-avatar::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70%);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .hero-name {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .hero-role {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .hero-role.tank { background: var(--tank); }
        .hero-role.warrior { background: var(--warrior); }
        .hero-role.assassin { background: var(--assassin); }
        .hero-role.mage { background: var(--mage); }
        .hero-role.marksman { background: var(--marksman); }
        .hero-role.support { background: var(--support); }

        .hero-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-gold);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 20px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalSlideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes modalSlideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 40px;
            text-align: center;
            position: relative;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .close-modal:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            transform: rotate(90deg);
        }

        .modal-avatar {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--bg-card), var(--bg-primary));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-body {
            padding: 40px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--accent-gold);
            border-radius: 2px;
        }

        .skill-list {
            display: grid;
            gap: 16px;
        }

        .skill-item {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--accent-blue);
        }

        .skill-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--accent-blue);
        }

        .skill-desc {
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .equipment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        .equipment-item {
            background: var(--bg-card);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .equipment-item:hover {
            border-color: var(--accent-gold);
            transform: translateY(-4px);
        }

        .equipment-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 12px;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-blue));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .equipment-name {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .tips-list {
            display: grid;
            gap: 12px;
        }

        .tip-item {
            background: var(--bg-card);
            padding: 16px 20px;
            border-radius: 10px;
            display: flex;
            align-items: start;
            gap: 12px;
        }

        .tip-bullet {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            background: var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }

            .hero-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 16px;
            }

            .filter-buttons {
                gap: 8px;
            }

            .filter-btn {
                padding: 10px 18px;
                font-size: 0.85rem;
            }

            .modal-content {
                margin: 20px 0;
            }

            .modal-body {
                padding: 24px;
            }

            .equipment-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }

        /* Loading Animation */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 20px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

        let currentFilter = 'all';
        let currentSearch = '';

        // 初始化页面
        function init() {
            renderHeroes();
            setupEventListeners();
        }

        // 渲染英雄卡片
        function renderHeroes() {
            const grid = document.getElementById('heroGrid');
            const filteredHeroes = heroesData.filter(hero => {
                const matchesRole = currentFilter === 'all' || hero.role === currentFilter;
                const matchesSearch = hero.name.toLowerCase().includes(currentSearch.toLowerCase());
                return matchesRole && matchesSearch;
            });

            if (filteredHeroes.length === 0) {
                grid.innerHTML = '<div class="loading">未找到匹配的英雄</div>';
                return;
            }

            grid.innerHTML = filteredHeroes.map((hero, index) => `
                <div class="hero-card ${hero.role}" onclick="showHeroDetail(${heroesData.indexOf(hero)})" style="animation-delay: ${index * 0.05}s">
                    <div class="hero-avatar">${hero.avatar}</div>
                    <div class="hero-name">${hero.name}</div>
                    <span class="hero-role ${hero.role}">${hero.roleName}</span>
                    <div class="hero-stats">
                        <div class="stat">
                            <div class="stat-label">难度</div>
                            <div class="stat-value">${'★'.repeat(hero.difficulty)}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">攻击</div>
                            <div class="stat-value">${hero.attack}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">防御</div>
                            <div class="stat-value">${hero.defense}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 设置事件监听
        function setupEventListeners() {
            // 筛选按钮
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.role;
                    renderHeroes();
                });
            });

            // 搜索框
            document.getElementById('searchInput').addEventListener('input', function(e) {
                currentSearch = e.target.value;
                renderHeroes();
            });

            // 关闭模态框（点击背景）
            document.getElementById('heroModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });
        }

        // 显示英雄详情
        function showHeroDetail(index) {
            const hero = heroesData[index];
            const modal = document.getElementById('heroModal');
            
            // 填充模态框内容
            document.getElementById('modalAvatar').textContent = hero.avatar;
            document.getElementById('modalName').textContent = hero.name;
            document.getElementById('modalRole').textContent = hero.roleName;
            document.getElementById('modalRole').className = `hero-role ${hero.role}`;
            
            // 技能列表
            document.getElementById('skillList').innerHTML = hero.skills.map(skill => `
                <div class="skill-item">
                    <div class="skill-name">${skill.name}</div>
                    <div class="skill-desc">${skill.desc}</div>
                </div>
            `).join('');
            
            // 装备列表
            document.getElementById('equipmentGrid').innerHTML = hero.equipment.map((item, i) => `
                <div class="equipment-item">
                    <div class="equipment-icon">${['⚔️', '👟', '🛡️', '💎', '⚡', '🔮'][i % 6]}</div>
                    <div class="equipment-name">${item}</div>
                </div>
            `).join('');
            
            // 技巧列表
            document.getElementById('tipsList').innerHTML = hero.tips.map((tip, i) => `
                <div class="tip-item">
                    <div class="tip-bullet">${i + 1}</div>
                    <div>${tip}</div>
                </div>
            `).join('');
            
            // 显示模态框
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // 关闭模态框
        function closeModal() {
            const modal = document.getElementById('heroModal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
